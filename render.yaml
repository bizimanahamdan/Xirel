services:
  - type: web
    name: xirel
    env: docker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: SESSION_TTL_DAYS
        value: "7"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
